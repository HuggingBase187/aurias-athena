<html><head><style>
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
svg{width:1360px;height:auto;display:block}
:root{--border-strong:#8a8a8a}
.box rect,rect.box{fill:#f4f4f2;stroke:#8a8a8a}
.c-purple rect,.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.th{font-size:14px;font-weight:600;fill:#1f1f1f}
.ts{font-size:12px;fill:#555}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-gray .th{fill:#2C2C2A}.c-gray .ts{fill:#5F5E5A}
.arr{stroke:#6b6b6b;fill:none;stroke-width:1.5}
text{dominant-baseline:central}
</style></head><body><svg width="100%" viewBox="0 0 680 520" role="img"><title>Aurias 2 origination pipeline</title><desc>Ten steps in two columns. Left: pick niche, discover to staging, quality gate, promote to master, enrich. Right: verify, qualify, outreach, meeting, LOI. Each step names its owner. The Head of Origination measures every stage.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="58" text-anchor="middle" dominant-baseline="central">1. Pick niche</text><text class="ts" x="170" y="78" text-anchor="middle" dominant-baseline="central">Head of Research (planned)</text></g>
<line x1="170" y1="96" x2="170" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="124" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="142" text-anchor="middle" dominant-baseline="central">2. Discover into staging</text><text class="ts" x="170" y="162" text-anchor="middle" dominant-baseline="central">Sourcing agent, 7 channels</text></g>
<line x1="170" y1="180" x2="170" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="208" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="226" text-anchor="middle" dominant-baseline="central">3. Quality gate</text><text class="ts" x="170" y="246" text-anchor="middle" dominant-baseline="central">Script: real, live, not a dupe</text></g>
<line x1="170" y1="264" x2="170" y2="288" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="292" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="310" text-anchor="middle" dominant-baseline="central">4. Promote to master</text><text class="ts" x="170" y="330" text-anchor="middle" dominant-baseline="central">Script, when no batch runs</text></g>
<line x1="170" y1="348" x2="170" y2="372" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="376" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="394" text-anchor="middle" dominant-baseline="central">5. Enrich</text><text class="ts" x="170" y="414" text-anchor="middle" dominant-baseline="central">Sourcing agent + Skill</text></g>
<path d="M300 404 L340 404 L340 68 L376 68" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="380" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="58" text-anchor="middle" dominant-baseline="central">6. Verify</text><text class="ts" x="510" y="78" text-anchor="middle" dominant-baseline="central">Verifier, 95% accuracy floor</text></g>
<line x1="510" y1="96" x2="510" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="380" y="124" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="142" text-anchor="middle" dominant-baseline="central">7. Qualify</text><text class="ts" x="510" y="162" text-anchor="middle" dominant-baseline="central">Rulebook; you review flags</text></g>
<line x1="510" y1="180" x2="510" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="380" y="208" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="226" text-anchor="middle" dominant-baseline="central">8. Outreach</text><text class="ts" x="510" y="246" text-anchor="middle" dominant-baseline="central">Outreach agent; you approve</text></g>
<line x1="510" y1="264" x2="510" y2="288" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="380" y="292" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="310" text-anchor="middle" dominant-baseline="central">9. Meeting</text><text class="ts" x="510" y="330" text-anchor="middle" dominant-baseline="central">Athena preps; you meet, log</text></g>
<line x1="510" y1="348" x2="510" y2="372" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="380" y="376" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="394" text-anchor="middle" dominant-baseline="central">10. LOI</text><text class="ts" x="510" y="414" text-anchor="middle" dominant-baseline="central">Daniel</text></g>
<rect x="40" y="460" width="600" height="36" rx="8" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="340" y="478" text-anchor="middle" dominant-baseline="central">Head of Origination owns and measures every stage, quarterly and cumulative</text>
</svg></body></html>
